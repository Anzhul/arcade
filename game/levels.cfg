# ============================================
#          ARCADE LEVEL EDITOR
# ============================================
#
# Format:
#   level <number>
#   wave <type> <count>:<spawnrate> [<type> <count>:<spawnrate>...]
#
# Only list the alien types you want — omitted types default to 0.
# count:spawnrate = how many to spawn and ticks between each spawn
# (lower spawnrate = faster spawning)
#
# delay <n> on its own line adds a pause before the next wave.
# You can also inline it: wave basic 20:8 delay 50
#
# Alien types:
#   basic    - Green, 30 HP, standard enemy
#   fast     - Yellow, 20 HP, dashes when low
#   tank     - Red, 60 HP, slow and tough
#   elite    - Purple, 40 HP, has shield, shoots
#   launcher - Pink, 45 HP, stays on screen, fires homing missiles
#   beam           - Cyan, 50 HP, stays on screen, fires beam
#   anchorelite    - Purple, 60 HP + shield, stays on screen, shoots
#   anchorelitebeam- Purple, 60 HP + shield, stays on screen, fires beam
#   rocketboss     - Crimson, 200 HP + shield, homing rockets + scatter
#   miniboss       - Green, 150 HP + shield, homing missiles
#
# Boss (level 6) is handled specially — an empty wave triggers it.
#
# ============================================

level 1
# Introduction
wave basic 20:8
wave fast 10:3
delay 30
wave basic 30:6
wave fast 20:3
wave fast 20:3
wave fast 20:3
delay 50
wave basic 50:4 fast 30:4
delay 80
wave miniboss 1:15

level 2
# Introducing tanks + tri-boss
wave basic 30:8
delay 30
wave tank 10:12
wave fast 40:4
delay 40
wave tank 30:6 fast 60:4
wave fast 40:3
delay 80
wave miniboss 3:10

level 3
# Introducing elites
wave basic 20:12 
wave fast 20:8 tank 10:8
wave elite 2:14
wave fast 40:4
wave fast 40:4
wave elite 8:10
wave elite 8:10 fast 40:4
delay 80
# Mini-boss: 3 anchored elites (shoot) + 2 anchored elites (beam)
wave anchorelite 3:15 anchorelitebeam 2:20

level 4
# Introducing launchers
wave basic 8:10 fast 10:6 
wave tank 10:14 elite 2:12 
wave launcher 2:20
wave tank 16:6 launcher 3:18
wave tank 20:6 launcher 6:18 
delay 80
# Rocket Boss - homing rockets + scatter attack
wave rocketboss 1:15

level 5
# Final challenge - launchers and beams
wave basic 5:10 fast 10:6 tank 3:12 elite 3:10 launcher 2:18 beam 1:25
wave basic 3:8 fast 5:5 tank 5:10 elite 5:8 launcher 3:16 beam 1:22
wave basic 5:7 fast 10:4 tank 4:10 elite 6:8 launcher 2:14 beam 2:20
wave basic 3:6 fast 8:4 tank 5:8 elite 8:6 launcher 3:12 beam 2:18

level 6
# Boss fight
wave spawnrate 999
